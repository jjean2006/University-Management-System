<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden &mdash; Institutional Access Control</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-base);">
  <div class="card" style="max-width: 480px; width: 100%; text-align: center; padding: 36px 28px;">
    <div class="brand-logo-mark" style="margin: 0 auto 16px auto; background-color: var(--badge-danger-text);">403</div>
    <h1 style="font-size: 20px; color: var(--badge-danger-text); margin-bottom: 8px;">Access Forbidden</h1>
    <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5;">
      Your authenticated account role does not have authorization to access this institutional administrative section.
    </p>
    <a href="/login" class="btn btn-primary">Return to Portal Sign In</a>
  </div>
</body>
</html>
