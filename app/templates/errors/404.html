<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found &mdash; Institutional Portal</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-base);">
  <div class="card" style="max-width: 480px; width: 100%; text-align: center; padding: 36px 28px;">
    <div class="brand-logo-mark" style="margin: 0 auto 16px auto;">404</div>
    <h1 style="font-size: 20px; color: var(--text-primary); margin-bottom: 8px;">Resource Not Found</h1>
    <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5;">
      The requested endpoint or record could not be found on this server. Please verify the URL or return to the portal.
    </p>
    <a href="/" class="btn btn-primary">Return to Portal Home</a>
  </div>
</body>
</html>
